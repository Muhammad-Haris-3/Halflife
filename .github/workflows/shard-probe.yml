# Does sharding the poll across parallel runners buy independent rate limits?
#
# A single runner sustains only ~0.5 req/s against api.npmjs.org, which puts the
# full frame at ~22 h against a 6-hour ceiling. PREREGISTRATION.md §10's stated
# fallback is to cut the frame by rank, but that rule assumed the constraint was
# a rate. It is a PER-IP rate, and GitHub gives each matrix job its own runner.
#
# ANSWERED, 2026-08-29: yes. Four shards drew four distinct Azure egress IPs
# (20.109.36.226, 134.33.70.240, 52.161.59.144, 4.246.135.160) and each behaved
# exactly like a lone runner at the same target — 31% refused and 0.69-0.70 req/s
# achieved per shard, against 27% and 0.73 req/s for one runner by itself. Shards
# do not share a bucket; that run was simply targeting 1 req/s when the per-IP
# ceiling is nearer 0.5.
#
# So aggregate throughput scales with shard count, and eight shards at the
# sustainable 0.5 req/s give 4 req/s and about 4.2 h for the whole frame. §10's
# rank reduction is not required.
#
# Each shard reports its egress IP, which settles the shared-bucket question
# directly rather than by inference from refusal rates.
name: shard-probe

on:
  workflow_dispatch:
    inputs:
      shard_list:
        description: JSON list of shard indices, e.g. [0,1,2,3,4,5,6,7]
        default: "[0,1,2,3,4,5,6,7]"
      rate:
        description: Target requests/second per shard
        default: "1"
      per_level:
        description: Requests per shard
        default: "150"

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shard_list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Egress IP
        id: ip
        run: |
          IP=$(curl -s --max-time 20 https://api.ipify.org || echo unknown)
          echo "shard ${{ matrix.shard }} egress IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Probe this shard
        run: |
          set +e
          python scripts/poll_probe.py \
            --per-level "${{ inputs.per_level }}" \
            --rates "${{ inputs.rate }}" \
            --shards "${{ strategy.job-total }}" \
            --shard "${{ matrix.shard }}" \
            --json-out "shard-${{ matrix.shard }}.json"
          rc=$?
          set -e
          if [ $rc -gt 1 ]; then
            echo "::error::shard ${{ matrix.shard }} exited $rc — it did not run to a verdict"
            exit $rc
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          d = json.load(open('shard-%s.json' % os.environ['SHARD']))
          l = d['levels'][0]
          print('| %s | `%s` | %d | %d | %.0f%% | %.2f |' % (
              os.environ['SHARD'], os.environ['IP'], l['ok'], l['http_429'],
              l['refusal_share'] * 100, l['achieved_rate']))
          PY
        env:
          SHARD: ${{ matrix.shard }}
          IP: ${{ steps.ip.outputs.ip }}

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json

  verdict:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
      - name: Decide
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json
          rows = [json.load(open(f)) for f in sorted(glob.glob('shard-*.json'))]
          if not rows:
              print('## Shard probe\n\nNo shard produced output.')
              raise SystemExit(0)
          lv = [r['levels'][0] for r in rows]
          ok = sum(l['ok'] for l in lv)
          ref = sum(l['http_429'] for l in lv)
          share = ref / max(ok + ref, 1)
          agg = sum(l['achieved_rate'] for l in lv)
          frame = rows[0]['full_frame_size']
          print('## Shard probe verdict')
          print()
          print('| shard | ok | 429 | refused | achieved r/s |')
          print('|---|---|---|---|---|')
          for r, l in zip(rows, lv):
              print('| %d | %d | %d | %.0f%% | %.2f |'
                    % (r['shard'], l['ok'], l['http_429'], l['refusal_share'] * 100,
                       l['achieved_rate']))
          print('| **all** | **%d** | **%d** | **%.0f%%** | **%.2f** |'
                % (ok, ref, share * 100, agg))
          print()
          hours = frame / agg * 1.5 / 3600 if agg else float('inf')
          print('Aggregate %.2f req/s across %d shards -> **%.2f h** for the '
                '%s-package frame with the 1.5x margin.'
                % (agg, len(rows), hours, format(frame, ',')))
          print()
          # Whether the limits are INDEPENDENT is not the same question as whether
          # the chosen rate was sustainable, and an earlier version of this script
          # conflated them: it saw 31% aggregate refusals and concluded parallel
          # runners buy nothing, when in fact every shard was independently sitting
          # at its own ceiling because the target was set above it.
          #
          # The discriminator is whether a shard behaves like a lone runner at the
          # same target rate. If it does, the buckets are separate and aggregate
          # throughput scales with shard count. If the shards were sharing one
          # bucket, each would be refused far harder than a lone runner is.
          spread = max(l['refusal_share'] for l in lv) - min(l['refusal_share'] for l in lv)
          per_shard = agg / len(lv)
          scaled = agg / max(max(l['achieved_rate'] for l in lv), 1e-9)
          print('Per-shard achieved rates are within %.1f points of each other, and '
                'aggregate throughput is %.1fx the best single shard.'
                % (spread * 100, scaled))
          print()
          if share <= 0.01:
              print('**Independent rate limits, and this rate is sustainable.** '
                    '%d shards at %.2f req/s each carry the frame in %.2f h. '
                    '§10 rank reduction is not required.' % (len(lv), per_shard, hours))
          elif scaled >= len(lv) * 0.8:
              print('**Independent rate limits, but this target is above the per-IP '
                    'ceiling** (%.0f%% refused). Throughput still scaled %.1fx across '
                    '%d shards, so sharding works — re-run at a lower per-shard rate '
                    'to find the clean configuration. Do NOT cut the frame on this.'
                    % (share * 100, scaled, len(lv)))
          else:
              print('**Shards appear to share a rate limit**: aggregate throughput '
                    'scaled only %.1fx across %d shards. Parallel runners do not buy '
                    'throughput and §10 rank reduction stands as the fallback.'
                    % (scaled, len(lv)))
          PY
